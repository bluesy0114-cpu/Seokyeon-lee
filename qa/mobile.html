<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>QA mobile preview</title>
<style>
  html,body{margin:0;padding:0;background:#1b1b1b;}
  .row{display:flex;gap:10px;padding:10px;align-items:flex-start;}
  .frame{width:390px;height:844px;border:1px solid #444;background:#000;overflow:hidden;}
  .frame iframe{width:390px;height:844px;border:0;display:block;}
  .one{padding:0;}
  .one iframe{width:390px;height:1000px;}
</style></head>
<body>
<div class="row" id="row">
  <div class="frame"><iframe src="../index.html" title="index mobile"></iframe></div>
  <div class="frame"><iframe src="../projects.html" title="projects mobile"></iframe></div>
  <div class="frame"><iframe src="../films.html" title="films mobile"></iframe></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  if (q.get('p')) {
    var url = '../' + q.get('p') + '.html';
    var y = parseInt(q.get('y') || '0', 10);
    var h = parseInt(q.get('h') || '844', 10);
    document.body.innerHTML = '<div class="frame one"><iframe id="f" src="' + url + '" style="width:390px;height:' + h + 'px"></iframe></div>';
    var f = document.getElementById('f');
    f.addEventListener('load', function () {
      try { f.contentWindow.scrollTo(0, y); } catch (e) {}
    });
  }
</script>
</body></html>
