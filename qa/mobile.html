<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>QA mobile preview</title>
<style>
  html,body{margin:0;padding:0;background:#1b1b1b;}
  .row{display:flex;gap:10px;padding:10px;align-items:flex-start;}
  .frame{width:390px;height:844px;border:1px solid #444;background:#000;overflow:hidden;}
  .frame iframe{width:390px;height:844px;border:0;display:block;}
  .one{padding:0;}
  .one iframe{width:390px;height:1000px;}
</style></head>
<body>
<div class="row" id="row">
  <div class="frame"><iframe aria-hidden="true" title="index mobile"></iframe></div>
  <div class="frame"><iframe aria-hidden="true" title="projects mobile"></iframe></div>
  <div class="frame"><iframe aria-hidden="true" title="films mobile"></iframe></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var v = q.get('v') || Date.now();
  var names = ['index', 'projects', 'films'];
  if (q.get('p')) {
    var y = parseInt(q.get('y') || '0', 10);
    var h = parseInt(q.get('h') || '844', 10);
    document.getElementById('row').innerHTML =
      '<div class="frame one"><iframe id="f" aria-hidden="true" style="width:390px;height:' + h + 'px"></iframe></div>';
    var f = document.getElementById('f');
    f.src = '../' + q.get('p') + '.html?v=' + v;
    f.addEventListener('load', function () {
      try {
        f.contentDocument.documentElement.style.scrollBehavior = 'auto';
        f.contentWindow.scrollTo({top: y, behavior: 'instant'});
      } catch (e) {}
    });
  } else {
    var fs = document.querySelectorAll('#row iframe');
    names.forEach(function (n, i) { fs[i].src = '../' + n + '.html?v=' + v; });
  }
</script>
</body></html>
